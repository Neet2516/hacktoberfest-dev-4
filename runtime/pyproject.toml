[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "specter-runtime"
version = "0.1.0"
description = "Autonomous Multi-Agent AI Runtime for SPECTER (The Ghost Maintainer)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "SPECTER Maintenance Team", email = "maintainers@specter.local" }
]
dependencies = [
    "pydantic>=2.5.0",
    "jsonschema>=4.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["specter_runtime*"]
